name: Release

# Two ways to publish a version (both run the same pipeline):
#   1. npm run release:minor && git push --follow-tags    # tag pushed from your machine
#   2. Actions → Release → Run workflow, tag "vX.Y.Z"      # creates the annotated tag on the branch head
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v1.0.0. Created as an annotated tag on the selected branch if it does not exist yet.'
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  IMAGE: ghcr.io/${{ github.repository_owner }}/stewardbook

jobs:
  tag:
    name: Ensure tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
      - name: Create the annotated tag if it doesn't exist
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists — re-releasing it."; exit 0
          fi
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "$TAG" ]; then
            echo "::error::package.json is at $pkg; bump it before releasing $TAG"; exit 1
          fi
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git tag -a "$TAG" -m "Stewardbook $TAG" -m "$(node scripts/changelog-section.mjs "$TAG")"
          git push origin "refs/tags/$TAG"
          echo "Created annotated tag $TAG at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  meta:
    name: Resolve version
    needs: tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      build: ${{ steps.v.outputs.build }}
      date: ${{ steps.v.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$version" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg"; exit 1
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          {
            echo "tag=$tag"; echo "version=$version"; echo "prerelease=$prerelease"
            echo "build=${{ github.run_number }}"; echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "### Releasing \`$tag\` · build ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify
    needs: meta
    uses: ./.github/workflows/ci.yml

  bundle:
    name: Node bundle
    needs: [meta, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
          BUILD_NUMBER: ${{ needs.meta.outputs.build }}
          GIT_SHA: ${{ github.sha }}
          BUILD_DATE: ${{ needs.meta.outputs.date }}
      - name: Package
        run: |
          set -euo pipefail
          name="stewardbook-v${{ needs.meta.outputs.version }}"
          mkdir -p "dist/$name"
          cp -r build drizzle package.json package-lock.json .npmrc README.md LICENSE CHANGELOG.md .env.example "dist/$name/"
          cat > "dist/$name/BUILD_INFO" <<EOF
          version=${{ needs.meta.outputs.version }}
          build=${{ needs.meta.outputs.build }}
          commit=${{ github.sha }}
          date=${{ needs.meta.outputs.date }}
          EOF
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS.txt)
          node scripts/changelog-section.mjs "${{ needs.meta.outputs.version }}" > dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md

  image:
    name: Container image
    needs: [meta, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: docker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.tag }},enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ needs.meta.outputs.tag }},enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=raw,value=build-${{ needs.meta.outputs.build }}
          labels: |
            org.opencontainers.image.title=Stewardbook
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker.outputs.tags }}
          labels: ${{ steps.docker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
            BUILD_NUMBER=${{ needs.meta.outputs.build }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.date }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: GitHub Release
    needs: [meta, bundle, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist
      - name: Add install notes
        run: |
          cat >> dist/RELEASE_NOTES.md <<'EOF'

          ---

          ### Install

          **Docker** (amd64 and arm64):

          ```bash
          docker pull ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
          ```

          **Node bundle**: download `stewardbook-v${{ needs.meta.outputs.version }}.tar.gz`, then run `npm ci --omit=dev && node build` with `DATABASE_URL` set. Checksums are in `SHA256SUMS.txt`.

          Build **${{ needs.meta.outputs.build }}** · commit `${{ github.sha }}`
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Stewardbook ${{ needs.meta.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.prerelease == 'false' }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
