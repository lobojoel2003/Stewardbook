<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1d2b4a" />
		<title>Offline · Stewardbook</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				background: #f6f4ef;
				color: #131c31;
				padding: 24px;
				text-align: center;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #0e1424;
					color: #e9edf5;
				}
			}
			main {
				max-width: 420px;
			}
			img {
				border-radius: 14px;
			}
			h1 {
				font-size: 1.4rem;
				margin: 18px 0 8px;
			}
			p {
				line-height: 1.5;
				opacity: 0.8;
			}
			button {
				margin-top: 16px;
				font: inherit;
				font-weight: 600;
				padding: 10px 18px;
				border-radius: 10px;
				border: 0;
				background: #1d2b4a;
				color: #fff;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" alt="" width="64" height="64" />
			<h1>You’re offline</h1>
			<p>
				This page hasn’t been opened on this device before, so there’s no saved copy. Cases you have opened recently are still
				available, and anything you add to a timeline is kept on the device until the connection comes back.
			</p>
			<button onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
