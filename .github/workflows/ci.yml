name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  BUILD_NUMBER: ${{ github.run_number }}
  GIT_SHA: ${{ github.sha }}

jobs:
  quality:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stewardbook_ci_unit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint (Prettier + ESLint)
        run: npm run lint
      - name: Type-check (svelte-check + service worker)
        run: npm run check
      - name: Unit & integration tests with coverage
        run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/stewardbook_ci_unit
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${s[k].pct}% | ${s[k].covered}/${s[k].total} |`;
            console.log(["### Test coverage", "| Metric | % | Covered |", "|---|---|---|", ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stewardbook_ci_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        # Ubuntu mirrors occasionally answer 503; retry instead of failing the build.
        run: |
          for attempt in 1 2 3 4; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Browser install failed (attempt $attempt), retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          exit 1
      - name: Build
        run: npm run build
      - name: Run Playwright
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/stewardbook_ci_e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker image & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: stewardbook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
      - name: Start the stack
        run: STEWARDBOOK_IMAGE=stewardbook:ci docker compose up -d --no-build --wait --wait-timeout 120
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          # First run redirects to setup.
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3000/)" = "303 http://localhost:3000/setup"
          curl -fsS http://localhost:3000/setup | grep -q 'Set up your local'
          curl -fsS http://localhost:3000/manifest.webmanifest | grep -q '"name": "Stewardbook"'
      - name: Logs
        if: always()
        run: docker compose logs app
      - name: Stop
        if: always()
        run: docker compose down -v

  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: [quality, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Describe build
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "name=stewardbook-v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "### Build \`v${version}\` · build ${{ github.run_number }} · \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            build/
            drizzle/
            package.json
            package-lock.json
          retention-days: 30
